name: 🎮 Build UtatarApp iOS IPA

on:
  push:
    branches: [ main, arena/* ]
    paths:
      - 'UtatarApp/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'UtatarApp/**'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write   # so job "release" can create/update a GitHub Release with the IPA

env:
  PROJECT_NAME: UtatarApp
  SCHEME_NAME: UtatarApp
  APP_NAME: UtatarApp
  XCODE_VERSION: '15.0'

jobs:
  # ==========================================
  # Job 1: Build a real, installable IPA for TrollStore
  # ==========================================
  build-ipa:
    name: 📦 Build TrollStore IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: 🏗️ Build app (device, no signing)
        id: build
        run: |
          set -euxo pipefail
          xcodebuild \
            -project "${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.xcodeproj" \
            -target "${{ env.SCHEME_NAME }}" \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build/Build/Products/Release-iphoneos" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=YES

      - name: 📱 Package into .ipa (ad-hoc signed)
        run: |
          set -euo pipefail
          APP_DIR="build/Build/Products/Release-iphoneos/${{ env.APP_NAME }}.app"
          echo "APP_DIR=$APP_DIR"
          ls -la "$APP_DIR"

          if [ ! -d "$APP_DIR" ]; then
            echo "::error::App bundle not found at $APP_DIR"
            exit 1
          fi

          # Ad-hoc sign so it's valid for a device (TrollStore re-signs on install too).
          /usr/bin/codesign --force --deep --sign - "$APP_DIR" \
            || echo "::warning::Ad-hoc signing failed; packaging unsigned (TrollStore will sign on install)."

          # Build the standard iOS Payload/ layout used by .ipa files.
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_DIR" build/ipa/Payload/
          ls -la build/ipa/Payload

          # Create the .ipa (a zip containing a Payload/ folder at the root).
          cd build/ipa
          /usr/bin/zip -qry "../../${{ env.APP_NAME }}.ipa" Payload
          cd ../..
          ls -la "${{ env.APP_NAME }}.ipa"

          # Smoke-test that it really is a valid .ipa (zip) with the app inside.
          unzip -l "${{ env.APP_NAME }}.ipa" | head -20

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtatarApp-IPA
          path: ${{ env.APP_NAME }}.ipa
          if-no-files-found: error
          retention-days: 30

  # ==========================================
  # Job 2: Create a GitHub Release with the IPA attached
  # ==========================================
  release:
    name: 🚀 Create Release
    runs-on: macos-14
    needs: build-ipa
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download IPA
        uses: actions/download-artifact@v4
        with:
          name: UtatarApp-IPA
          path: release/

      - name: 🏷️ Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: UtatarApp v${{ github.run_number }}
          body: |
            ## 🎮 UtatarApp Release v${{ github.run_number }}

            ### 📱 Install with TrollStore
            1. Download **UtatarApp.ipa** (the file attached below).
            2. Open it in **TrollStore**.
            3. Tap **Install** and it appears on your Home Screen.

            > ⚠️ This is an *ad-hoc signed* IPA built for real devices (arm64). No Apple
            > developer certificate is needed — it's designed for TrollStore.

            ### ✨ Features
            - 🕵️ Spy Bot: auto-scout villages
            - ⚔️ Attack Bot: auto-attack rich villages
            - 🤖 Automation: auto-collect, build, train
            - 📊 Resource monitoring

            ### ✅ Requirements
            - iOS 16.4+ (or TrollStore-compatible device)
            - TrollStore installed
          files: |
            release/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
