name: 🎮 Build UtatarApp iOS

on:
  push:
    branches: [ main, arena/* ]
    paths:
      - 'UtatarApp/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'UtatarApp/**'
  workflow_dispatch:  # Manual trigger

env:
  PROJECT_NAME: UtatarApp
  SCHEME_NAME: UtatarApp
  XCODE_VERSION: '15.0'

jobs:
  # ==========================================
  # Job 1: Build for Simulator (Testing)
  # ==========================================
  build-simulator:
    name: 📱 Build for Simulator
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      
      - name: 📦 Cache SPM dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: 🏗️ Build for Simulator
        run: |
          xcodebuild clean build \
            -project UtatarApp/${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME_NAME }} \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.0' \
            -configuration Debug \
            -derivedDataPath build/ \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      
      - name: ✅ Build Success
        run: echo "✅ Simulator build succeeded!"
      
      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtatarApp-Simulator-Build
          path: build/Build/Products/Debug-iphonesimulator/${{ env.PROJECT_NAME }}.app
          retention-days: 7

  # ==========================================
  # Job 2: Build IPA (Release)
  # ==========================================
  build-ipa:
    name: 📦 Build IPA
    runs-on: macos-14
    timeout-minutes: 45
    needs: build-simulator
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      
      - name: 📦 Cache SPM dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: 🔐 Setup Signing (Optional)
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # If you have signing certificates, add them here
          # For now, we'll build without signing for testing
          echo "Building without code signing for testing..."
          echo "To enable signing, add these secrets to your repo:"
          echo "  - P12_BASE64: Base64 encoded .p12 certificate"
          echo "  - P12_PASSWORD: Certificate password"
          echo "  - TEAM_ID: Apple Developer Team ID"
          echo "  - PROVISIONING_PROFILE: Base64 encoded provisioning profile"
      
      - name: 🏗️ Build Archive
        run: |
          xcodebuild clean archive \
            -project UtatarApp/${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME_NAME }} \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ \
            -archivePath build/${{ env.PROJECT_NAME }}.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      
      - name: 📱 Create ExportOptions.plist
        run: |
          cat > build/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF
      
      - name: 📦 Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/${{ env.PROJECT_NAME }}.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa/ \
            | xcpretty || true
      
      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtatarApp-IPA
          path: |
            build/ipa/*.ipa
            build/${{ env.PROJECT_NAME }}.xcarchive
          retention-days: 30

  # ==========================================
  # Job 3: Lint & Code Quality
  # ==========================================
  lint:
    name: 🔍 Code Quality
    runs-on: macos-14
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      
      - name: 🔍 SwiftLint (if available)
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint lint --reporter github-actions-logging
          else
            echo "SwiftLint not installed, skipping..."
          fi
      
      - name: 📊 Check Swift files
        run: |
          echo "📋 Swift files in project:"
          find UtatarApp -name "*.swift" -type f | wc -l
          echo ""
          echo "📁 Project structure:"
          find UtatarApp -type f | head -20

  # ==========================================
  # Job 4: Create Release (on main branch)
  # ==========================================
  release:
    name: 🚀 Create Release
    runs-on: macos-14
    needs: [build-ipa, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📥 Download IPA
        uses: actions/download-artifact@v4
        with:
          name: UtatarApp-IPA
          path: release/
      
      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: UtatarApp v${{ github.run_number }}
          body: |
            ## 🎮 UtatarApp Release v${{ github.run_number }}
            
            ### ✨ Features:
            - 🕵️ Spy Bot: Auto-scout villages
            - ⚔️ Attack Bot: Auto-attack rich villages
            - 🤖 Automation: Auto-collect, build, train
            - 🏃 Auto-retreat when attacked
            - 📊 Resource monitoring
            
            ### 📱 Installation:
            1. Download the IPA file
            2. Install using AltStore or Sideloadly
            3. Open and enjoy!
            
            ### ⚠️ Notes:
            - Requires iOS 16.4+
            - Use responsibly
          files: |
            release/**/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
