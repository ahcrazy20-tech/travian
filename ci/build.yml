name: 🎮 Build UtatarApp iOS

# ─────────────────────────────────────────────────────────────
# Triggers are intentionally NOT filtered by `paths:` — a path filter is the
# classic reason a push looks like "the build never started".
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        required: true
        default: Debug
        options: [Debug, Release]
      publish_release:
        description: 'Also publish a GitHub Release with the IPA'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: UtatarApp
  SCHEME_NAME: UtatarApp
  XCODE_PROJECT: UtatarApp/UtatarApp.xcodeproj
  DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
  # Signing (optional). Add these in Settings → Secrets and variables → Actions.
  P12_BASE64: ${{ secrets.P12_BASE64 }}
  P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
  PROVISION_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
  TEAM_ID: ${{ secrets.TEAM_ID }}

jobs:
  # ==========================================================
  # Job 1 — cheap, Linux-only sanity checks (no Mac minutes)
  # ==========================================================
  checks:
    name: 🔍 Project sanity checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧪 Validate Xcode project, Info.plist, assets and Swift declarations
        run: |
          if [ -f scripts/check_project.py ]; then
            python3 scripts/check_project.py .
          else
            echo "⚠️  scripts/check_project.py not on this branch - skipping the static check"
          fi

  # ==========================================================
  # Job 2 — build for the simulator (proves the code compiles)
  # ==========================================================
  build-simulator:
    name: 📱 Build for iOS Simulator
    runs-on: macos-latest          # macos-14 is deprecated; don't pin old images
    needs: checks
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Toolchain info
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          echo "--- available schemes ---"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: 🏗️ Build (simulator, unsigned)
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DERIVED_DATA")"
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME_NAME" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration "${{ inputs.configuration || 'Debug' }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild-simulator.log

      - name: 🧯 Show the exact compiler errors
        if: failure()
        run: |
          echo "===== errors / failed commands ====="
          grep -nE "error:|fatal error:|warning: .*deprecat|The following build commands failed" \
            build/xcodebuild-simulator.log | head -80 || true
          echo "===== last 40 lines ====="
          tail -40 build/xcodebuild-simulator.log || true

      - name: 📤 Upload simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: UtatarApp-simulator-app
          path: build/DerivedData/Build/Products/${{ inputs.configuration || 'Debug' }}-iphonesimulator/${{ env.PROJECT_NAME }}.app
          if-no-files-found: error
          retention-days: 7

  # ==========================================================
  # Job 3 — archive for the device, ad-hoc sign, build a REAL .ipa,
  #         and publish it as a Release asset so you download UtatarApp.ipa
  #         directly (Artifacts are always wrapped in a .zip — that's why
  #         you got a zip before).
  # ==========================================================
  build-ipa:
    name: 📦 IPA (device) + Release link
    runs-on: macos-latest
    needs: [checks, build-simulator]
    timeout-minutes: 45
    permissions:
      contents: write          # needed to create the Release with the .ipa
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 Is code signing configured?
        id: signing
        run: |
          if [ -n "${P12_BASE64:-}" ] && [ -n "${TEAM_ID:-}" ]; then
            echo "enabled=true"  >> "$GITHUB_OUTPUT"
            echo "✅ Signing secrets found → the IPA will be signed with your certificate"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No signing secrets → IPA is ad-hoc signed (correct for TrollStore / TrolStore)"
          fi

      - name: 🏗️ Archive (Release, device)
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DERIVED_DATA")"
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            SIGNING_ARGS=(-allowProvisioningUpdates DEVELOPMENT_TEAM="$TEAM_ID")
          else
            SIGNING_ARGS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="")
          fi
          xcodebuild clean archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME_NAME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/${{ env.PROJECT_NAME }}.xcarchive \
            -derivedDataPath "$DERIVED_DATA" \
            ENABLE_BITCODE=NO \
            "${SIGNING_ARGS[@]}" \
            2>&1 | tee build/xcodebuild-archive.log

      - name: 🧯 Show the exact compiler errors
        if: failure()
        run: |
          echo "===== errors / failed commands ====="
          grep -nE "error:|fatal error:|The following build commands failed" \
            build/xcodebuild-archive.log | head -80 || true
          echo "===== last 40 lines ====="
          tail -40 build/xcodebuild-archive.log || true

      - name: 📦 Build UtatarApp.ipa
        run: |
          set -euo pipefail
          ARCHIVE="build/${PROJECT_NAME}.xcarchive"
          APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)"
          if [ -z "$APP" ]; then
            echo "❌ no .app inside the archive" >&2
            find "$ARCHIVE" -maxdepth 3 | head -40 >&2
            exit 1
          fi
          echo "Packing: $APP"

          python3 - "$APP" <<'PY'
          import plistlib, pathlib, sys
          data = plistlib.loads((pathlib.Path(sys.argv[1]) / "Info.plist").read_bytes())
          print("Bundle id      :", data.get("CFBundleIdentifier"))
          print("Version        :", data.get("CFBundleShortVersionString"), "build", data.get("CFBundleVersion"))
          print("Minimum iOS    :", data.get("MinimumOSVersion"))
          sig = pathlib.Path(sys.argv[1]) / "_CodeSignature"
          print("Signature      :", "present" if sig.exists() else "none yet -> will be ad-hoc signed")
          PY

          # An archive built with CODE_SIGNING_ALLOWED=NO has no signature at all.
          # TrollStore installs that, but an ad-hoc signature is friendlier to every
          # installer (TrolStore / Esign / Sideloadly) and avoids "Code Signature Invalid".
          if [ ! -d "$APP/_CodeSignature" ] && [ "${{ steps.signing.outputs.enabled }}" != "true" ]; then
            echo "→ ad-hoc signing (codesign -s -)"
            codesign --force --deep --sign - --timestamp=none "$APP"
            codesign -dvvv "$APP" 2>&1 | grep -E "^Identifier|^CodeDirectory|Signature" || true
          fi

          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          # -y keeps symlinks; the payload layout (Payload/App.app) is what installers expect
          (cd build/ipa && zip -qryX "$GITHUB_WORKSPACE/build/${PROJECT_NAME}.ipa" Payload)
          echo "--- IPA layout (must start with Payload/UtatarApp.app/) ---"
          unzip -l "build/${PROJECT_NAME}.ipa" | sed -n '4,7p'
          unzip -l "build/${PROJECT_NAME}.ipa" | grep -q "Payload/${PROJECT_NAME}.app/Info.plist" || {
            echo "❌ bad layout - installers would reject this .ipa" >&2; exit 1; }
          ls -lh build/*.ipa
          echo "IPA_SIZE=$(du -h build/${PROJECT_NAME}.ipa | cut -f1)" >> "$GITHUB_ENV"
          echo "IPA_PATH=build/${PROJECT_NAME}.ipa" >> "$GITHUB_ENV"

      - name: 🚀 Publish the .ipa as a Release asset (direct download — no zip)
        if: github.event_name == 'push'
        continue-on-error: true   # the .ipa is still in the artifact if publishing fails
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ipa-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          TITLE="UtatarApp IPA — ${GITHUB_REF_NAME} (build ${GITHUB_RUN_NUMBER})"
          LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${PROJECT_NAME}.ipa"
          NOTES="📲 **Install on your iPhone:** open this link in Safari on the phone or paste it into TrolStore.

          | | |
          |---|---|
          | File | \`${PROJECT_NAME}.ipa\` (${IPA_SIZE:-?}) |
          | Min iOS | 15.0 |
          | Signature | ad-hoc (install with TrollStore / TrolStore, or re-sign with Sideloadly/AltStore) |

          Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_PATH" --clobber
          else
            gh release create "$TAG" "$IPA_PATH" --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          {
            echo "## 📲 Your IPA is ready"
            echo
            echo "**Direct download (a real \`.ipa\`, not a zip):**"
            echo
            echo "\`\`\`"
            echo "$LINK"
            echo "\`\`\`"
            echo
            echo "1. Open that link on the iPhone (Safari) → \`${PROJECT_NAME}.ipa\` gets saved to the Files app."
            echo "2. TrolStore → *Add app / install by URL* → paste the same link → install."
            echo "3. Or grab it from https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Release asset: $LINK"

      - name: 📤 Upload the .ipa (as an artifact too)
        uses: actions/upload-artifact@v4
        with:
          name: UtatarApp-ipa
          path: build/${{ env.PROJECT_NAME }}.ipa
          if-no-files-found: error
          retention-days: 30
